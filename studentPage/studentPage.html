<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <title>ExGrev</title>
  </head>
  <body>
    <header></header>
    <main>
      <section class="container mt-5 bg-primary text-white p-2 rounded">
        <form>
          <h1 style="text-align: center">Submit a Problem</h1>
          <div class="mb-3 fw-semibold">
            <label for="grievanceSubject" class="form-label"
              >Grievance Subject</label
            >
            <input
              type="text"
              class="form-control"
              id="grievanceSubject"
              placeholder="Enter grievance subject"
            />
          </div>
          <div class="mb-3 fw-semibold">
            <label for="grievanceDescription" class="form-label"
              >Grievance Description</label
            >
            <textarea
              class="form-control"
              id="grievanceDescription"
              rows="3"
              placeholder="Describe your problem in detail..."
            ></textarea>
          </div>
        </form>
        <div class="container d-flex justify-content-start">
          <div class="dropdown m-2">
            <button
              class="btn btn-secondary dropdown-toggle"
              type="button"
              data-bs-toggle="dropdown"
              aria-expanded="false"
            >
              Select Problem Type
            </button>
            <ul class="dropdown-menu" id="problemTypeDropdown">
              <li>
                <a
                  class="dropdown-item"
                  href="# "
                  onclick="manageTagSelection('1')"
                  >Major Exam</a
                >
              </li>
              <li>
                <a
                  class="dropdown-item"
                  href="#"
                  onclick="manageTagSelection('2')"
                  >Minor Exam</a
                >
              </li>
              <li>
                <a
                  class="dropdown-item"
                  href="#"
                  onclick="manageTagSelection('3')"
                  >Quiz</a
                >
              </li>
              <li>
                <a
                  class="dropdown-item"
                  href="#"
                  onclick="manageTagSelection('4')"
                  >Result/Marksheet</a
                >
              </li>
            </ul>
          </div>
          <div class="dropdown m-2">
            <button
              class="btn btn-secondary dropdown-toggle"
              type="button"
              data-bs-toggle="dropdown"
              aria-expanded="false"
            >
              Select Grievance Type
            </button>
            <ul class="dropdown-menu" id="grievanceTypeDropdown">
              <li><a class="dropdown-item" href="#"></a></li>
            </ul>
          </div>
        </div>
        <button
          type="button"
          class="btn btn-success m-2 ms-auto p-2"
          onclick="handleSubmit()"
        >
          Submit
        </button>
      </section>
    </main>
    <footer></footer>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="./studentPage.js"></script>
  </body>
</html>
