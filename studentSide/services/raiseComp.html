<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Complaint</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <header>
      <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
          <a class="navbar-brand" href="#">ExGrev</a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="#">Home</a>
              </li>
              <li class="nav-item">
                <a class="nav-link disabled" href="#">Link</a>
              </li>
              <li class="nav-item">
                <a class="nav-link disabled" aria-disabled="true">Disabled</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>
    <main>
      <section>
        <div class="p-3 mb-2 bg-primary text-white">
          <h4>Drop a Complaint</h4>
          <div class="p-3 mb-2 bg-white text-dark rounded">
            <div class="mb-3 text-primary-emphasis">
              <label for="currentUser-email" class="form-label"
                >Email address</label
              >
              <input
                type="email"
                class="form-control"
                id="currentUser-email"
                placeholder="25ab1ab11@mitsgwl.ac.in"
              />
            </div>
            <div class="mb-3 text-primary-emphasis">
              <label for="complaint-text" class="form-label"
                >Explain your problem</label
              >
              <textarea
                class="form-control"
                id="complaint-text"
                rows="3"
              ></textarea>
            </div>
            <div class="mb-3">
              <label for="report-file" class="form-label"
                >Upload Supporting Documents</label
              >
              <input class="form-control" type="file" id="report-file" />
            </div>
            <button type="button" id="submit-button" class="btn btn-success">
              Submit
            </button>
          </div>
        </div>
      </section>
    </main>
    <footer></footer>
  </body>
  <script src="./JavaScript/raiseComp.js"></script>
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"
  ></script>
</html>
