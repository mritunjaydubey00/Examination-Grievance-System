<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <title>ExGrev</title>
  </head>
  <body>
    <header></header>
    <main>
      <section class="container mt-5 bg-primary text-white p-2 rounded">
        <form>
          <h1 style="text-align: center">Submit a Problem</h1>
          <div class="mb-3 fw-semibold">
            <label for="grievanceSubject" class="form-label"
              >Grievance Subject</label
            >
            <input
              type="text"
              class="form-control"
              id="grievanceSubject"
              placeholder="Enter grievance subject"
            />
          </div>
          <div class="mb-3 fw-semibold">
            <label for="grievanceDescription" class="form-label"
              >Grievance Description</label
            >
            <textarea
              class="form-control"
              id="grievanceDescription"
              rows="3"
              placeholder="Describe your problem in detail..."
            ></textarea>
          </div>
        </form>
        <div id="tags" class="d-flex">
          <div class="btn-group dropup m-3 p-2">
            <button
              type="button"
              class="btn btn-info dropdown-toggle"
              data-bs-toggle="dropdown"
              aria-expanded="false"
            >
              Exam
            </button>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item" href="#">Minor</a></li>
              <li><hr class="dropdown-divider" /></li>
              <li><a class="dropdown-item" href="#">Major</a></li>
              <li><hr class="dropdown-divider" /></li>
              <li><a class="dropdown-item" href="#">Quiz</a></li>
            </ul>
          </div>
          <div class="btn-group dropup m-3 p-2">
            <button
              type="button"
              class="btn btn-info dropdown-toggle"
              data-bs-toggle="dropdown"
              aria-expanded="false"
            >
              Type
            </button>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item" href="#">problem type 1</a></li>
              <li><hr class="dropdown-divider" /></li>
              <li><a class="dropdown-item" href="#">Problem type 2</a></li>
              <li><hr class="dropdown-divider" /></li>
              <li><a class="dropdown-item" href="#">Problem type 3</a></li>
            </ul>
          </div>
          <button type="button" class="btn btn-success m-1 ms-auto p-2">
            Submit
          </button>
        </div>
      </section>
    </main>
    <footer></footer>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
