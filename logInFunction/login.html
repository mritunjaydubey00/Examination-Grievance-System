<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <title>ExGrev</title>
  </head>
  <body>
    <header></header>
    <main>
      <section id="login-hero-box">
        <div class="m-3 bg-primary rounded-3 p-3 text-white">
          <div class="text-center"><h1>ExGrev Login</h1></div>
          <div class="mb-3">
            <label for="userId" class="form-label">Email address</label>
            <input
              type="email"
              class="form-control"
              id="userId"
              placeholder="name@example.com"
            />
          </div>

          <div class="mb-3">
            <label for="userPassword" class="form-label">Password</label>
            <input
              type="password"
              class="form-control"
              id="userPassword"
              placeholder="Password"
            />
          </div>
          <div class="text-center">
            <button
              type="button"
              class="btn btn-success"
              onClick="handleLogin()"
            >
              Login
            </button>
          </div>
        </div>
      </section>
    </main>
    <footer></footer>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="loginLogic.js"></script>
  </body>
</html>
